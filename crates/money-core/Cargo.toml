[package]
name = "money-core"
description = "The ledger of Money Manager: records, their RDX store, and sync. No interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# RDX CRDT storage + sync. These crates are workspace members of the tresse repo;
# cargo locates each by package name within the git checkout. Cargo.lock pins the
# exact resolved commit. For local development against a tresse checkout, swap
# these for the path variant below.
rdx-rs = { git = "https://gitlab.com/ragusseven/tresse.git", branch = "master" }
rdx-sync = { git = "https://gitlab.com/ragusseven/tresse.git", branch = "master" }
rdx-sync-s3 = { git = "https://gitlab.com/ragusseven/tresse.git", branch = "master" }
rdx-sync-fs = { git = "https://gitlab.com/ragusseven/tresse.git", branch = "master" }
# rdx-rs = { path = "../../../tresse/rdx-rs" }
# rdx-sync = { path = "../../../tresse/rdx-sync" }
# rdx-sync-s3 = { path = "../../../tresse/rdx-sync-s3" }
# rdx-sync-fs = { path = "../../../tresse/rdx-sync-fs" }
chrono = { workspace = true, features = ["serde"] }
uuid = { version = "1.11", features = ["v4"] }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
