[package]
name = "money-core"
description = "The ledger of Money Manager: records and native RDX versioned by Tresse. No interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Native RDX is versioned and synchronized by the embedded Tresse client.
money-tresse = { path = "../money-tresse" }
rdx-rs = { git = "https://gitlab.com/ragusseven/tresse.git", branch = "master" }
# Only used to read the previous chunk format during migration.
rdx-sync = { git = "https://gitlab.com/ragusseven/tresse.git", branch = "master" }
rdx-sync-fs = { git = "https://gitlab.com/ragusseven/tresse.git", branch = "master" }
chrono = { workspace = true, features = ["serde"] }
uuid = { version = "1.11", features = ["v4"] }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
