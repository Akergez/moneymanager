[package]
name = "money-manager"
description = "Expenses, income and transfers across accounts, kept in a native RDX ledger versioned and synchronized by Tresse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# A shared object as well, which is what an Android activity loads.
[lib]
crate-type = ["lib", "cdylib"]

[build-dependencies]
# Links the icon into the Windows executable (`build.rs`). The same crate,
# at the same version, that GPUI embeds its manifest with.
embed-resource = "3"

[dependencies]
money-core = { path = "../money-core" }
gpui-kit = "0.7.0"
# The theme's colours: a Material You scheme made from the system's colour.
# Cargo finds each crate by name within the checkout, and Cargo.lock pins
# the commit. To work on the library beside the application, swap these for
# the path variant below.
gpui-adaptive-colors = { git = "https://github.com/Akergez/gpui-adaptive-colors", branch = "main" }
# Themes made for the Zed editor, to wear instead of a scheme.
gpui-zed-themes = { git = "https://github.com/Akergez/gpui-adaptive-colors", branch = "main" }
# gpui-adaptive-colors = { path = "../../adaptive-colors/crates/gpui-adaptive-colors" }
# gpui-zed-themes = { path = "../../adaptive-colors/crates/gpui-zed-themes" }
chrono.workspace = true
dirs = "6"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The Android side shared with matterfast and aiddiction: android_main, the
# status bar, the insets, saving a document, back. Every function of it also
# exists off Android. Its Java half is `com.akergez.gpui:android-glue` in
# android/app/build.gradle.kts, at the same version.
# To work on it beside the application, swap this for the path variant below
# and build the package with -PglueLocal (android/settings.gradle.kts).
gpui-android-glue = { git = "https://github.com/Akergez/gpui-android-glue", tag = "v0.2.0" }
# gpui-android-glue = { path = "../../../gpui-android-glue" }

[target.'cfg(target_os = "android")'.dependencies]
# With no subscriber, events go to `log`, and from there to logcat.
tracing = { workspace = true, features = ["log"] }
