[package]
name = "money-manager"
description = "Expenses, income and transfers across accounts, kept in a CRDT ledger that syncs to S3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# A shared object as well, which is what an Android activity loads.
[lib]
crate-type = ["lib", "cdylib"]

[build-dependencies]
# Links the icon into the Windows executable (`build.rs`). The same crate,
# at the same version, that GPUI embeds its manifest with.
embed-resource = "3"

[dependencies]
money-core = { path = "../money-core" }
gpui-kit = "0.7.0"
# The theme's colours: a Material You scheme made from the system's colour.
# Cargo finds each crate by name within the checkout, and Cargo.lock pins
# the commit. To work on the library beside the application, swap these for
# the path variant below.
gpui-adaptive-colors = { git = "https://github.com/Akergez/gpui-adaptive-colors", branch = "main" }
# Themes made for the Zed editor, to wear instead of a scheme.
gpui-zed-themes = { git = "https://github.com/Akergez/gpui-adaptive-colors", branch = "main" }
# gpui-adaptive-colors = { path = "../../adaptive-colors/crates/gpui-adaptive-colors" }
# gpui-zed-themes = { path = "../../adaptive-colors/crates/gpui-zed-themes" }
chrono.workspace = true
dirs = "6"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# The platform GPUI does not ship: the toolkit is handed one from this fork,
# which tracks the same `gpui-pre` and is not on crates.io at this version.
[target.'cfg(target_os = "android")'.dependencies]
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "9075e3aa3eea812127f2c60ed66f0cd5798ff245" }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
log = "0.4"
# With no subscriber, events go to `log`, and from there to logcat.
tracing = { workspace = true, features = ["log"] }
