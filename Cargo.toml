# Standalone repo nested inside the tresse checkout — opt out of tresse's workspace.
[workspace]
resolver = "2"
members = ["crates/money-core", "crates/money-manager"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0"
authors = ["Akergez"]
repository = "https://gitlab.com/ragusseven/money-manager-ng"

[workspace.dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[profile.dev]
# The toolkit is most of the build; without its debug information a debug
# build links in seconds and takes a fraction of the disk.
debug = "line-tables-only"

[profile.release]
# What `cargo build --release` gives you while working on the application: an
# optimised binary that does not take minutes to rebuild after an edit.
incremental = true

[profile.dist]
# What gets shipped: thin LTO and one codegen unit. Slow, and it only has to
# happen once per release: `cargo build --profile dist`, binary in `target/dist`.
inherits = "release"
lto = "thin"
codegen-units = 1
incremental = false
strip = true
